<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <!-- Vazirmatn & Pacifico Cursive Fonts from Google CDN -->

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'Tahoma', 'sans-serif'],
            cursive: ['Pacifico', 'cursive', 'sans-serif'],

          colors: {
            brand: {
              navy: '#1E293B',
              darkBlue: '#1D4ED8', // Rich blue to match screenshots
              accent: '#2563EB',
              bgLight: '#E5E7EB',
              cardBg: '#FFFFFF',
              borderDark: '#1E293B',
            }

      }

  </script>
  
  <style>
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background-color: #E2E8F0; /* Soft beautiful background */
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Elegant Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #E2E8F0;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Skeleton shimmer animation */
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    .shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased flex flex-col justify-between">

  <!-- Main Container (centered and max-width like mobile screen on large screens) -->

    <!-- HEADER CARD (Matching Screenshot 64 exactly - Clean text style, no blue background badges) -->
    <header id="header-card" class="bg-white rounded-3xl shadow-sm p-6 mb-6 flex items-center justify-between border border-slate-100/80 transform transition duration-300 hover:shadow-md">

        <h1 id="header-title" class="text-[34px] font-normal text-[#1E3A8A] font-cursive tracking-wide leading-none mb-1.5 select-none">testmoslem</h1>
        
        <!-- Subtitle - Clean text matching screenshot -->
        <span id="header-subtitle" class="text-xs font-black text-[#1D4ED8] tracking-wider leading-relaxed block mb-1">
          Cafe & Resturant
        </span>
        
        <!-- Slogan/Description - Clean text matching screenshot -->
        <div id="header-desc-container" class="mt-0.5">

      </div>

      <!-- Right Side: Logo Box with Palm Tree & Cheetah in Blue Style -->
      <div id="header-logo-container" class="w-24 h-24 bg-white rounded-2xl flex items-center justify-center border border-slate-50 overflow-hidden shrink-0">
        <div id="header-logo" class="w-full h-full flex items-center justify-center text-[#1E3A8A]">
          <!-- Cheetah and palm tree fallback vector exactly like Screenshot 64 -->

            <!-- Palm Tree -->
            <path d="M50 15c-1 3-3 6-6 8c4-1 8-1 11-1c-2-2-4-5-6-7z" fill="currentColor"/>
            <path d="M50 15c1 3 3 6 6 8c-4-1-10-1-11-1c2-2 4-5 6-7z" fill="currentColor"/>
            <path d="M50 15c-2 2-5 4-8 4c3-1 5-4 6-7c-1 3-2 6-4 8c3-1 6-3 6-5z" fill="currentColor"/>
            <path d="M50 15c2 2 5 4 8 4c-3-1-5-4-6-7c1 3 2 6 4 8c-3-1-6-3-6-5z" fill="currentColor"/>
            <path d="M49 15v20h2V15h-2z" fill="currentColor"/>
            <!-- Cheetah/Leopard Silhouette -->
            <path d="M35 48c2 0 4-1 5-2s1-3 3-3s3 2 4 4s2 3 4 3s4-2 5-4s2-2 3-1s1 2-1 3s-4 1-5 2s-1 3-3 3s-3-2-4-4s-2-3-4-3s-4 2-5 4s-2 2-3 1s-1-2 1-3zm-1 5c1 0 2-1 3-1s1-2 2-2s2 1 3 2s1 2 2 2s2-1 3-2s1-2 2-2s2 1 3 2s1 2 2 2s2-1 3-2s1-2 2-2s2 1 3 2s1 2 2 2s2-1 3-2s1-2 2-2s2 1 3 2s1 2 2 2c1 0 1-1 2-1s1 0 1 1v1c-1 1-2 1-3 1s-1 1-2 1s-2-1-3-2s-1-2-2-2s-2 1-3 2s-1 2-2 2s-2-1-3-2s-1-2-2-2s-2 1-3 2s-1 2-2 2s-2-1-3-2s-1-2-2-2s-2 1-3 2s-1 2-2 2c-1 0-1-1-2-1s-1 0-1 1v-1z" fill="currentColor"/>
          </svg>
        </div>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <div class="relative mb-6">
      <input type="text" id="search-input" placeholder="جستجوی محصول..." 
        class="w-full bg-white text-slate-700 placeholder-slate-400 text-sm font-semibold py-3.5 px-11 rounded-2xl shadow-sm border border-slate-100 outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 text-center transition-all">
      <div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
        <!-- Search icon SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.637 10.637z" />
        </svg>

      <!-- Clear Search Button -->
      <button id="clear-search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">

        </svg>
      </button>
    </div>

    <!-- MAIN VIEW (CATEGORIES GRID) -->
    <div id="categories-view" class="transition-opacity duration-300">
      <!-- Loading Skeleton for Categories -->
      <div id="categories-skeleton" class="grid grid-cols-3 gap-3">
        <script>
          for (let i = 0; i < 15; i++) {
            document.write(`
              <div class="bg-white rounded-2xl p-4 flex flex-col items-center justify-center border border-slate-100 shadow-sm space-y-3 h-28">
                <div class="w-12 h-12 rounded-full shimmer"></div>
                <div class="h-3 w-16 rounded shimmer"></div>
              </div>
            `);
          }
        </script>
      </div>

      <!-- Categories Container -->
      <div id="categories-container" class="grid grid-cols-3 gap-3 hidden">
        <!-- Dynamically populated categories -->
      </div>
    </div>

    <!-- CATEGORY ITEMS VIEW (HIDDEN BY DEFAULT) -->
    <div id="items-view" class="hidden opacity-0 transform translate-y-4 transition-all duration-300 flex-grow flex flex-col">
      <!-- Category Header card (Screenshot 65 style) -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4 flex items-center justify-between">
        <!-- Placeholder space on left to perfectly center the text -->
        <div class="w-8"></div>
        <h2 id="selected-category-title" class="text-base font-bold text-slate-800 text-center">نام دسته‌بندی</h2>
        <!-- Close (X) button on the right -->
        <button id="close-items-view" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Loading Skeleton for Items -->
      <div id="items-skeleton" class="space-y-3 hidden">
        <script>
          for (let i = 0; i < 4; i++) {
            document.write(`
              <div class="bg-white rounded-2xl p-4 flex items-center justify-between border border-slate-100 shadow-sm h-28">
                <div class="flex-grow flex flex-col justify-between h-full pl-4 space-y-2">
                  <div class="h-4 w-32 rounded shimmer"></div>
                  <div class="h-3 w-16 rounded shimmer"></div>
                  <div class="h-2.5 w-full rounded shimmer"></div>
                </div>
                <div class="w-20 h-20 rounded-xl shimmer flex-shrink-0"></div>
              </div>
            `);
          }
        </script>
      </div>

      <!-- Items List Container -->
      <div id="items-container" class="space-y-3">
        <!-- Dynamically populated items -->
      </div>
    </div>

    <!-- SEARCH RESULTS VIEW (HIDDEN BY DEFAULT) -->
    <div id="search-view" class="hidden opacity-0 transform translate-y-4 transition-all duration-300 flex-grow flex flex-col">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-4 flex items-center justify-between">
        <span class="text-sm font-semibold text-slate-500" id="search-results-count">نتایج جستجو: ۲ مورد</span>
        <button id="clear-search-view" class="text-xs font-bold text-blue-600 hover:text-blue-800">پاک کردن</button>
      </div>
      <div id="search-results-container" class="space-y-3">
        <!-- Search results dynamic -->
      </div>
    </div>

    <!-- FOOTER CARD (Matching Screenshot 65 bottom exactly) -->
    <footer id="footer-card" class="bg-white rounded-3xl shadow-sm p-6 mt-8 flex flex-col items-center justify-center text-center space-y-3 border border-slate-100/80 transform transition duration-300">
      
      <!-- Phone Number -->
      <a id="footer-phone-link" href="tel:09035116886" class="flex items-center space-x-2 space-x-reverse text-slate-700 hover:text-blue-600 transition-colors text-sm font-black">
        <span class="text-blue-500">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-2.824-1.802-5.14-4.117-6.942-6.942l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
          </svg>
        </span>
        <span id="footer-phone">۰۹۰۳۵۱۱۶۸۸۶</span>
      </a>

      <!-- Address -->
      <div class="flex items-center space-x-2 space-x-reverse text-slate-500 text-xs font-semibold leading-relaxed">
        <span class="text-blue-500 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
          </svg>
        </span>
        <span id="footer-address">کیانپارس، بین میهن و یک</span>
      </div>

      <!-- Credit / Developer -->
      <div class="pt-3 border-t border-slate-100 w-full">
        <p id="footer-credit" class="text-[10px] text-slate-400 font-bold tracking-wide">ساخته شده توسط مسلم ال جابر</p>
      </div>

  </main>

  <!-- JAVASCRIPT FOR FUNCTIONALITY -->
  <script>
    // State
    let categories = [];
    let items = [];
    let settings = {};
    let activeCategoryId = null;

    // Persian Digit Converter
    function toPersianDigits(num) {
      if (num === null || num === undefined) return '';
      const id = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      return num.toString().replace(/[0-9]/g, function (w) {
        return id[+w];
      });
    }

    // Format prices elegantly (e.g. 366,000 to ۳۶۶,۰۰۰)
    function formatPrice(price) {
      if (!price) return '';
      // Strip any letters or non-digits, keep commas
      let clean = price.replace(/[^\d,]/g, '');
      // Try to parse to add commas if not exists
      if (!clean.includes(',') && !isNaN(clean) && clean !== '') {
        clean = Number(clean).toLocaleString('en-US');
      }
      return toPersianDigits(clean || price) + ' تومان';
    }

    // Load Data from API
    async function loadMenuData() {
      // Show skeletons
      document.getElementById('categories-skeleton').classList.remove('hidden');
      document.getElementById('categories-container').classList.add('hidden');
      
      try {
        const response = await fetch('/api/data');
        if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
        const data = await response.json();
        
        categories = data.categories || [];
        items = data.items || [];
        settings = data.settings || {};
        
        renderSettings();
        renderCategories();
      } catch (err) {
        console.error('Error loading menu:', err);
        alert('خطا در بارگذاری منو. لطفا صفحه را مجددا بارگذاری کنید.');
      }
    }

    // Render Settings (Header & Footer)
    function renderSettings() {
      if (settings.title) {
        document.getElementById('header-title').textContent = settings.title;
        document.title = `منوی دیجیتال ${settings.title}`;
      }
      if (settings.subtitle) {
        document.getElementById('header-subtitle').textContent = settings.subtitle;
      }
      if (settings.description) {
        document.getElementById('header-desc').textContent = settings.description;
        document.getElementById('header-desc-container').classList.remove('hidden');
      } else {
        document.getElementById('header-desc-container').classList.add('hidden');
      }
      
      // Logo rendering
      const logoEl = document.getElementById('header-logo');
      if (settings.logo) {
        logoEl.innerHTML = `<img src="${settings.logo}" alt="Logo" class="w-full h-full object-contain rounded-2xl">`;
      } else {
        // Restore default leopard logo
        logoEl.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full">
            <path d="M50 15c-1 3-3 6-6 8c4-1 8-1 11-1c-2-2-4-5-6-7z" fill="currentColor"/>
            <path d="M50 15c1 3 3 6 6 8c-4-1-10-1-11-1c2-2 4-5 6-7z" fill="currentColor"/>
            <path d="M50 15c-2 2-5 4-8 4c3-1 5-4 6-7c-1 3-2 6-4 8c3-1 6-3 6-5z" fill="currentColor"/>
            <path d="M50 15c2 2 5 4 8 4c-3-1-5-4-6-7c1 3 2 6 4 8c-3-1-6-3-6-5z" fill="currentColor"/>
            <path d="M49 15v20h2V15h-2z" fill="currentColor"/>
            <path d="M35 48c2 0 4-1 5-2s1-3 3-3s3 2 4 4s2 3 4 3s4-2 5-4s2-2 3-1s1 2-1 3s-4 1-5 2s-1 3-3 3s-3-2-4-4s-2-3-4-3s-4 2-5 4s-2 2-3 1s-1-2 1-3zm-1 5c1 0 2-1 3-1s1-2 2-2s2 1 3 2s1 2 2 2s2-1 3-2s1-2 2-2s2 1 3 2s1 2 2 2s2-1 3-2s1-2 2-2s2 1 3 2s1 2 2 2s2-1 3-2s1-2 2-2s2 1 3 2s1 2 2 2c1 0 1-1 2-1s1 0 1 1v1c-1 1-2 1-3 1s-1 1-2 1s-2-1-3-2s-1-2-2-2s-2 1-3 2s-1 2-2 2s-2-1-3-2s-1-2-2-2s-2 1-3 2s-1 2-2 2s-2-1-3-2s-1-2-2-2s-2 1-3 2s-1 2-2 2c-1 0-1-1-2-1s-1 0-1 1v-1z" fill="currentColor"/>
          </svg>
        `;
      }

      // Footer rendering
      if (settings.phone) {
        document.getElementById('footer-phone').textContent = toPersianDigits(settings.phone);
        document.getElementById('footer-phone-link').href = `tel:${settings.phone}`;
        document.getElementById('footer-phone-link').classList.remove('hidden');
      } else {
        document.getElementById('footer-phone-link').classList.add('hidden');
      }

      if (settings.address) {
        document.getElementById('footer-address').textContent = settings.address;
        document.getElementById('footer-address').parentElement.classList.remove('hidden');
      } else {
        document.getElementById('footer-address').parentElement.classList.add('hidden');
      }

      if (settings.credit) {
        document.getElementById('footer-credit').textContent = settings.credit;
        document.getElementById('footer-credit').parentElement.classList.remove('hidden');
      } else {
        document.getElementById('footer-credit').parentElement.classList.add('hidden');
      }
    }

    // Render Categories Grid
    function renderCategories() {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';
      
      categories.forEach((cat, index) => {
        const catCard = document.createElement('button');
        catCard.className = `bg-white rounded-3xl p-4 flex flex-col items-center justify-between border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 transform active:scale-95 h-28 focus:outline-none opacity-0 translate-y-4`;
        catCard.style.animation = `fadeInUp 0.4s ease-out ${index * 40}ms forwards`;
        
        catCard.innerHTML = `
          <div class="w-14 h-14 flex items-center justify-center overflow-hidden mb-1">
            <img src="${cat.image}" alt="${cat.name}" class="w-full h-full object-contain filter drop-shadow">
          </div>
          <span class="text-[11px] font-bold text-slate-700 tracking-tight text-center leading-tight truncate w-full px-0.5">${cat.name}</span>
        `;
        
        catCard.addEventListener('click', () => openCategory(cat.id));
        container.appendChild(catCard);
      });
      
      // Hide skeleton, show categories
      document.getElementById('categories-skeleton').classList.add('hidden');
      container.classList.remove('hidden');
    }

    // Open Category Items
    function openCategory(catId) {
      activeCategoryId = catId;
      const category = categories.find(c => c.id === catId);
      if (!category) return;

      // Update Title
      document.getElementById('selected-category-title').textContent = category.name;

      // Hide Categories View with smooth transition
      const catView = document.getElementById('categories-view');
      const itemsView = document.getElementById('items-view');
      const searchView = document.getElementById('search-view');

      catView.classList.add('opacity-0');
      searchView.classList.add('hidden');
      
      setTimeout(() => {
        catView.classList.add('hidden');
        
        // Show items view & skeleton first
        itemsView.classList.remove('hidden');
        document.getElementById('items-skeleton').classList.remove('hidden');
        document.getElementById('items-container').innerHTML = ''; // Clear old

        // Render items after a tiny simulated loader to make it feel rich and high quality
        setTimeout(() => {
          document.getElementById('items-skeleton').classList.add('hidden');
          renderCategoryItems(catId);
          itemsView.classList.remove('opacity-0', 'translate-y-4');
          itemsView.classList.add('opacity-100', 'translate-y-0');
        }, 350);
        
      }, 150);
    }

    // Render Items inside Selected Category (Screenshot 65 matching style)
    function renderCategoryItems(catId) {
      const container = document.getElementById('items-container');
      container.innerHTML = '';

      const categoryItems = items.filter(item => item.categoryId === catId);

      if (categoryItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400 font-medium">
            هیچ آیتمی در این دسته‌بندی وجود ندارد.
          </div>
        `;
        return;
      }

      categoryItems.forEach((item, index) => {
        const itemCard = document.createElement('div');
        itemCard.className = `bg-white rounded-3xl p-4 flex items-center justify-between border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 transform opacity-0 translate-y-4`;
        itemCard.style.animation = `fadeInUp 0.4s ease-out ${index * 60}ms forwards`;

        itemCard.innerHTML = `
          <!-- Text Details (Left Side in RTL) -->
          <div class="flex-grow flex flex-col justify-between h-full pl-4 text-right">
            <div>
              <h3 class="text-sm font-extrabold text-slate-800 mb-1 tracking-tight leading-tight">${item.name}</h3>
              <span class="text-[13px] font-bold text-slate-700 block mb-1.5">${formatPrice(item.price)}</span>
            </div>
            <p class="text-[10.5px] font-medium text-slate-400 line-clamp-2 leading-relaxed">${item.description || 'بدون توضیحات'}</p>
          </div>
          
          <!-- Image (Right Side in RTL) -->
          <div class="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0 border border-slate-50 shadow-inner bg-slate-50">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=80&w=200'">
          </div>
        `;

        container.appendChild(itemCard);
      });
    }

    // Close Items View (Back to Categories)
    function closeItemsView() {
      const catView = document.getElementById('categories-view');
      const itemsView = document.getElementById('items-view');

      itemsView.classList.add('opacity-0', 'translate-y-4');
      
      setTimeout(() => {
        itemsView.classList.add('hidden');
        catView.classList.remove('hidden');
        
        // Trigger reflow
        void catView.offsetWidth;
        
        catView.classList.remove('opacity-0');
        activeCategoryId = null;
      }, 200);
    }

    // Handle Search functionality
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search');
    const searchView = document.getElementById('search-view');
    const categoriesView = document.getElementById('categories-view');
    const itemsView = document.getElementById('items-view');
    const searchResultsContainer = document.getElementById('search-results-container');
    const searchResultsCount = document.getElementById('search-results-count');

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      
      if (query.length > 0) {
        clearSearchBtn.classList.remove('hidden');
        performSearch(query);
      } else {
        clearSearchBtn.classList.add('hidden');
        cancelSearch();
      }
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      cancelSearch();
    });

    document.getElementById('clear-search-view').addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      cancelSearch();
    });

    function performSearch(query) {
      // Hide other views
      categoriesView.classList.add('hidden');
      itemsView.classList.add('hidden');
      searchView.classList.remove('hidden');
      
      // Filter items
      const results = items.filter(item => {
        const cat = categories.find(c => c.id === item.categoryId);
        const catName = cat ? cat.name.toLowerCase() : '';
        return item.name.toLowerCase().includes(query) || 
               item.description.toLowerCase().includes(query) ||
               catName.includes(query);
      });

      // Update count text
      searchResultsCount.textContent = `نتایج جستجو: ${toPersianDigits(results.length)} مورد`;

      searchResultsContainer.innerHTML = '';
      if (results.length === 0) {
        searchResultsContainer.innerHTML = `
          <div class="text-center py-12 text-slate-400 font-medium bg-white rounded-2xl shadow-sm border border-slate-100">
            هیچ محصولی با این نام پیدا نشد.
          </div>
        `;
      } else {
        results.forEach((item, index) => {
          const itemCard = document.createElement('div');
          itemCard.className = `bg-white rounded-3xl p-4 flex items-center justify-between border border-slate-100 shadow-sm h-28 transform opacity-0 translate-y-4`;
          itemCard.style.animation = `fadeInUp 0.4s ease-out ${index * 40}ms forwards`;

          const cat = categories.find(c => c.id === item.categoryId);
          const catBadge = cat ? `<span class="bg-blue-50 text-blue-600 text-[9px] font-bold px-2 py-0.5 rounded-full mb-1 inline-block">${cat.name}</span>` : '';

          itemCard.innerHTML = `
            <div class="flex-grow flex flex-col justify-between h-full pl-4 text-right">
              <div>
                ${catBadge}
                <h3 class="text-sm font-extrabold text-slate-800 mb-1 tracking-tight leading-tight">${item.name}</h3>
                <span class="text-[13px] font-bold text-slate-700 block mb-1.5">${formatPrice(item.price)}</span>
              </div>
              <p class="text-[10.5px] font-medium text-slate-400 line-clamp-1 leading-relaxed">${item.description || 'بدون توضیحات'}</p>
            </div>
            
            <div class="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0 border border-slate-50 shadow-inner bg-slate-50">
              <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=80&w=200'">
            </div>
          `;
          searchResultsContainer.appendChild(itemCard);
        });
      }

      // Smooth fade-in
      setTimeout(() => {
        searchView.classList.remove('opacity-0', 'translate-y-4');
        searchView.classList.add('opacity-100', 'translate-y-0');
      }, 50);
    }

    function cancelSearch() {
      searchView.classList.add('opacity-0', 'translate-y-4');
      setTimeout(() => {
        searchView.classList.add('hidden');
        if (activeCategoryId) {
          openCategory(activeCategoryId);
        } else {
          itemsView.classList.add('hidden');
          categoriesView.classList.remove('hidden');
          categoriesView.classList.remove('opacity-0');
        }
      }, 150);
    }

    // Event Listeners
    document.getElementById('close-items-view').addEventListener('click', closeItemsView);

    // Dynamic Injection of Keyframe Animation for beautiful fade-in effect
    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    `;
    document.head.appendChild(style);

    // Initial Load
    window.addEventListener('DOMContentLoaded', loadMenuData);
  </script>
</body>
</html>
